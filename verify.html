<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<title>Verify Email | SynoraConnect</title>
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<link rel="stylesheet" href="styles.css">
	</head>
	<body class="auth-page">
		<nav class="navbar" aria-label="Main navigation">
			<div class="site-info">
				<span class="logo logo-mark" aria-hidden="true">S</span>
				<p class="site-name">Synora</p>
			</div>
			<a class="default-button" href="index.html">Home</a>
		</nav>
		<main class="auth-main" data-verification-page>
			<section class="auth-card" aria-labelledby="verify-title">
				<p class="auth-eyebrow">ACCOUNT SECURITY</p>
				<h1 id="verify-title">Verify your email</h1>
				<p class="auth-description" data-verification-result role="status" aria-live="polite">Checking your verification link...</p>
				<p class="auth-switch"><a href="profile.html">Return to your profile</a></p>
			</section>
		</main>
		<script src="script.js" defer></script>
	</body>
</html>
