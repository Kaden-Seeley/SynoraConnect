services:
  - type: web
    name: synoraconnect
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 8 --timeout 45 --bind 0.0.0.0:$PORT --access-logfile - --error-logfile - webapp:app
    healthCheckPath: /healthz
    autoDeploy: true
    disk:
      name: synora-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.1
      - key: COOKIE_SECURE
        value: "1"
      - key: CHAT_DATABASE
        value: /var/data/accounts.sqlite3
      - key: PROFILE_PICTURES_DIR
        value: /var/data/profile-pictures
      - key: ADMIN_USERNAMES
        sync: false